<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ASTRERO | Traffic Optimizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./dashboard-modules.css?v=1">
  <link rel="stylesheet" href="./dashboard-live.css?v=3">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root{--ink:#17191c;--muted:#727980;--line:#e5e7eb;--soft:#f7f8f9;--green:#20a56b;--yellow:#d28d18;--red:#d94b57;--purple:#6d5ce7}*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:56px minmax(260px,320px) minmax(520px,1fr) minmax(280px,340px);transition:grid-template-columns .2s ease}.rail{background:#fafafa;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:5px}.rail button{border:0;background:none;color:#737a81;width:37px;height:37px;border-radius:9px;display:grid;place-items:center;cursor:pointer}.rail button:hover,.rail button.active{background:#eceef1;color:#17191c}.rail .brand{font-size:19px;color:#17191c;margin-bottom:22px}.rail-spacer{flex:1}.module-panel,.assistant{background:#fff;display:flex;flex-direction:column;min-width:0}.module-panel{border-right:1px solid var(--line)}.assistant{border-left:1px solid var(--line)}.module-head,.assistant-head{padding:20px 18px 14px;border-bottom:1px solid var(--line)}.module-head h1{font-size:19px;margin:0 0 14px;letter-spacing:-.03em}.search{height:38px;border:1px solid var(--line);border-radius:9px;display:flex;align-items:center;gap:8px;padding:0 10px;color:#90979e;font-size:12px}.search input{border:0;outline:0;flex:1;font:inherit;min-width:0}.key{border:1px solid var(--line);border-radius:5px;padding:2px 5px;font-size:10px}.filters{display:flex;gap:6px;margin-top:10px}.filter{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 9px;font-size:10px;color:#687078;cursor:pointer}.filter:hover{background:#f4f5f6}.create{margin:14px 18px;border:1px dashed #bac0c7;background:#fff;border-radius:10px;padding:14px;text-align:center;font-size:12px;font-weight:600;cursor:pointer}.create:hover{border-color:#767d85;background:#fafafa}.module-list{overflow:auto;padding:0 12px 20px}.module-card{border:1px solid var(--line);border-radius:11px;padding:14px;margin:8px 6px;cursor:pointer;transition:.18s ease}.module-card:hover,.module-card.selected{border-color:#aeb5bd;box-shadow:0 5px 16px #17191c0d;transform:translateY(-1px)}.module-card.selected{background:#fbfbfc}.card-top{display:flex;align-items:center;gap:9px}.status-dot{width:9px;height:9px;border-radius:50%;flex:none}.optimal{background:var(--green)}.moderate{background:var(--yellow)}.congested{background:var(--red)}.module-card strong{font-size:12px}.module-card p{color:var(--muted);font-size:11px;line-height:1.45;margin:8px 0}.tag{display:inline-flex;border:1px solid #e1e3e6;border-radius:99px;padding:4px 7px;font-size:9px;color:#687078}.workspace{display:flex;flex-direction:column;min-width:0;background:#f8f9fa}.workspace-head{height:67px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px}.tabs{display:flex;gap:3px}.tab{border:0;background:transparent;padding:10px 12px;border-radius:7px;font-size:12px;color:#7a8189;cursor:pointer}.tab.active{background:#17191c;color:white}.workspace-actions{display:flex;gap:7px}.btn{border:1px solid #d8dce0;background:#fff;border-radius:8px;padding:9px 11px;font-size:11px;display:flex;gap:7px;align-items:center;cursor:pointer}.btn.primary{background:#17191c;color:white;border-color:#17191c}.canvas{position:relative;flex:1;overflow:hidden;background-color:#f8f9fa;background-image:radial-gradient(#d9dde2 1px,transparent 1px);background-size:18px 18px}.canvas:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#f8f9fa66,transparent 20%,transparent 80%,#f8f9fa66);pointer-events:none}.map-wrap{position:absolute;inset:28px;border:1px solid #dfe3e7;border-radius:14px;overflow:hidden;box-shadow:0 8px 25px #17191c0b}.map-wrap #map{width:100%;height:100%}.map-label{position:absolute;z-index:500;top:14px;left:14px;background:#ffffffeb;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:10px;box-shadow:0 4px 12px #0000000b}.node{background:#fff;border:1px solid #d6dbe0;border-radius:9px;padding:7px 9px;box-shadow:0 4px 12px #00000016;font-size:9px;white-space:nowrap}.node b{font-size:10px;display:block;margin-bottom:3px}.node span{color:#6f7780}.node-status{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}.floating-start{position:absolute;z-index:600;bottom:22px;left:50%;transform:translateX(-50%);border:1px solid #17191c;background:#17191c;color:white;border-radius:99px;padding:11px 17px;display:flex;align-items:center;gap:8px;font-size:11px;box-shadow:0 7px 18px #0002;cursor:pointer}.assistant-head{height:67px;display:flex;justify-content:space-between;align-items:center}.assistant-head strong{font-size:14px}.assistant-actions{display:flex;gap:2px}.icon-btn{border:0;background:none;color:#707880;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;cursor:pointer}.icon-btn:hover{background:#f0f1f2;color:#17191c}.assistant-body{padding:25px 20px;overflow:auto;flex:1}.welcome-icon{width:34px;height:34px;border-radius:10px;background:#eeecff;color:var(--purple);display:grid;place-items:center;margin-bottom:17px}.assistant-body h2{font-size:19px;letter-spacing:-.03em;margin:0 0 9px}.assistant-body p{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 20px}.tip{font-size:10px;color:#707880;background:#f5f6f7;border-radius:7px;padding:10px;margin-bottom:18px;display:flex;justify-content:space-between;gap:5px}.suggestion{display:block;width:100%;text-align:left;border:1px solid var(--line);background:white;border-radius:8px;padding:11px;margin:7px 0;color:#555d65;font-size:11px;cursor:pointer}.suggestion:hover{background:#f7f8f9}.chat-input{margin:14px;border:1px solid #d6dade;border-radius:12px;min-height:74px;padding:11px;box-shadow:0 3px 12px #00000008}.chat-input textarea{width:100%;height:28px;resize:none;border:0;outline:0;font:12px inherit}.chat-tools{display:flex;justify-content:space-between;align-items:center}.chat-tools div{display:flex;gap:2px}.send{width:28px;height:28px;border-radius:50%;background:#17191c;color:white;border:0;display:grid;place-items:center;cursor:pointer}.assistant-msg{background:#f3f1ff;border-radius:9px;padding:10px;font-size:11px;line-height:1.45;margin-top:10px;color:#4b4770}.leaflet-control-attribution{font-size:8px}.leaflet-popup-content{font:11px Inter,system-ui}.leaflet-marker-icon.node-marker{background:transparent;border:0}.collapsed{grid-template-columns:56px 0 minmax(520px,1fr) minmax(280px,340px)}.collapsed .module-panel{overflow:hidden}.collapsed .assistant{display:none}.collapsed{grid-template-columns:56px 0 minmax(520px,1fr) 0}.dark{filter:invert(.92) hue-rotate(180deg)}@media(max-width:1100px){.app{grid-template-columns:56px 270px minmax(460px,1fr)}.assistant{display:none}.collapsed{grid-template-columns:56px 0 minmax(460px,1fr)}}@media(max-width:760px){body{overflow:auto}.app{height:auto;min-height:100vh;display:block}.rail{height:52px;flex-direction:row;padding:0 10px;position:sticky;top:0;z-index:1000}.rail .brand{margin:0 12px 0 0}.rail-spacer{display:block}.module-panel{height:390px;border-right:0;border-bottom:1px solid var(--line)}.workspace{height:680px}.workspace-head{height:auto;min-height:62px;flex-wrap:wrap;padding:10px}.map-wrap{inset:14px}.assistant{display:flex;height:520px;border-left:0;border-top:1px solid var(--line)}.collapsed{display:block}.collapsed .module-panel{display:none}.collapsed .workspace{height:680px}}
    /* Keep the shell fixed while allowing the two content panels to scroll. */
    .module-panel,.assistant,.workspace{min-height:0}
    .module-list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
    .assistant-body{min-height:0;overflow-y:auto;overflow-x:hidden}
  </style>
</head>
<body>
<div class="app" id="app">
  <aside class="rail"><button class="brand" aria-label="ASTRERO home">✦</button><button class="rail-item active"><i data-lucide="layout-dashboard"></i></button><button class="rail-item"><i data-lucide="map-pin"></i></button><button class="rail-item"><i data-lucide="chart-no-axes-combined"></i></button><button class="rail-item"><i data-lucide="route"></i></button><span class="rail-spacer"></span><button class="rail-item"><i data-lucide="settings-2"></i></button><button class="rail-item" id="collapse"><i data-lucide="panel-left-close"></i></button></aside>
  <aside class="module-panel"><div class="module-head"><h1>Junctions <span style="font-size:11px;color:#9299a0;font-weight:400">/ Traffic modules</span></h1><div class="search"><i data-lucide="search" width="15"></i><input placeholder="Search junctions..." id="search"><span class="key">⌘ K</span></div><div class="filters"><button class="filter">Zone⌄</button><button class="filter">Priority⌄</button><button class="filter">Status⌄</button></div></div><button class="create" id="create">+ Create new junction</button><div class="module-list" id="moduleList"></div></aside>
  <main class="workspace"><header class="workspace-head"><div class="tabs"><button class="tab active">Live map</button><button class="tab">Signal flow</button><button class="tab">Analytics</button></div><div class="workspace-actions"><button class="btn primary" id="simulate"><i data-lucide="siren" width="14"></i> Simulate emergency</button><button class="btn" id="details"><i data-lucide="panel-right" width="14"></i> View details</button><button class="icon-btn" aria-label="Share"><i data-lucide="link-2" width="15"></i></button></div></header><div class="canvas"><div class="map-wrap"><div id="map"></div><div class="map-label"><b>Live network map</b><br><span style="color:#737b82">6 junctions · 15 min forecast</span></div></div><button class="floating-start" id="start"><i data-lucide="play" width="13"></i> Start simulation</button></div></main>
  <aside class="assistant"><div class="assistant-head"><strong>Traffic Optimizer AI</strong><div class="assistant-actions"><button class="icon-btn" aria-label="Expand"><i data-lucide="maximize-2" width="15"></i></button><button class="icon-btn" aria-label="Feedback"><i data-lucide="message-square-more" width="15"></i></button><button class="icon-btn" aria-label="History"><i data-lucide="history" width="15"></i></button></div></div><div class="assistant-body"><div class="tip">Tip: Drag the left edge to resize the sidebar <button class="icon-btn" aria-label="Close tip">×</button></div><div class="welcome-icon"><i data-lucide="sparkles" width="17"></i></div><h2>Welcome to Traffic Optimizer AI</h2><p>I can help you analyze congestion patterns, simulate emergency routes, or explain signal decisions. Ask me anything.</p><div id="messages"></div><button class="suggestion">Why is congestion rising?</button><button class="suggestion">Summarize network health</button><button class="suggestion">Find the fastest corridor</button></div><div class="chat-input"><textarea id="chatInput" placeholder="Ask anything... Type @ to reference a junction"></textarea><div class="chat-tools"><div><button class="icon-btn" aria-label="Attach data"><i data-lucide="plus" width="15"></i></button><button class="icon-btn" aria-label="Voice input"><i data-lucide="mic" width="15"></i></button></div><button class="send" id="send" aria-label="Send"><i data-lucide="arrow-up" width="14"></i></button></div></div></aside>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const data=[['Junction 1 - MG Road','High traffic North-South corridor','congested','2 emergency routes'],['Junction 2 - Connaught Place','Adaptive cycle optimizing four approaches','optimal','AI active'],['Junction 3 - Dhaula Kuan','Airport corridor with moderate load','moderate','1 emergency route'],['Junction 4 - India Gate','Clear arterial, stable signal phase','optimal','AI active'],['Junction 5 - Noida Sector 18','Eastbound queue building at peak','moderate','Monitored'],['Junction 6 - Cyber Hub','Gurugram inbound corridor','optimal','AI active']];
const list=document.getElementById('moduleList');function render(items=data){list.innerHTML=items.map((x,i)=>`<article class="module-card ${i===1?'selected':''}" data-index="${i}"><div class="card-top"><span class="status-dot ${x[2]}"></span><strong>${x[0]}</strong></div><p>${x[1]}</p><span class="tag">${x[3]}</span></article>`).join('');list.querySelectorAll('.module-card').forEach(card=>card.onclick=()=>selectNode(Number(card.dataset.index)));}function selectNode(i){const x=data[i];document.querySelectorAll('.module-card').forEach(el=>el.classList.remove('selected'));list.children[i]?.classList.add('selected');document.getElementById('messages').innerHTML=`<div class="assistant-msg"><b>${x[0]}</b><br>Current state is ${x[2]}. I can explain the signal timing or model recommendation.</div>`;}
render();document.getElementById('search').oninput=e=>render(data.filter(x=>x.join(' ').toLowerCase().includes(e.target.value.toLowerCase())));
const map=L.map('map',{zoomControl:false}).setView([28.63,77.21],11);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO'}).addTo(map);const points=[[28.6328,77.2197],[28.5918,77.1616],[28.7369,77.161],[28.6129,77.2295],[28.5697,77.326],[28.495,77.089]];points.forEach((p,i)=>{const icon=L.divIcon({className:'node-marker',html:`<div class="node"><b><span class="node-status ${data[i][2]}"></span>${i+1} · ${data[i][0].split(' - ')[1]}</b><span>${i===1?'24s':'18s'} live phase</span></div>`,iconSize:[150,45],iconAnchor:[75,22]});L.marker(p,{icon}).addTo(map).on('click',()=>selectNode(i));});L.polyline(points.slice(0,4),{color:'#65b891',weight:3,dashArray:'8 8',opacity:.8}).addTo(map);
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');});document.getElementById('collapse').onclick=()=>document.getElementById('app').classList.toggle('collapsed');document.getElementById('simulate').onclick=()=>{document.getElementById('simulate').innerHTML='<i data-lucide="radio" width="14"></i> Dispatch mode active';document.getElementById('simulate').classList.add('active');lucide.createIcons();document.getElementById('messages').innerHTML='<div class="assistant-msg"><b>Dispatch mode ready.</b><br>Select a junction on the map to set the emergency start point.</div>';};document.getElementById('start').onclick=()=>document.getElementById('simulate').click();document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{document.getElementById('chatInput').value=b.textContent;document.getElementById('send').click();});function send(){const input=document.getElementById('chatInput');if(!input.value.trim())return;document.getElementById('messages').innerHTML=`<div class="assistant-msg"><b>You</b><br>${input.value}</div><div class="assistant-msg"><b>Traffic Optimizer AI</b><br>I am reviewing the live junction states and will surface the most relevant operational signal.</div>`;input.value='';}document.getElementById('send').onclick=send;document.getElementById('chatInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}};lucide.createIcons();
</script>
<script src="./frontend/app.js?v=20260920"></script>
<script src="./dashboard-modules.js?v=1"></script>
<script src="./dashboard-live.js?v=3"></script>
</body></html>
